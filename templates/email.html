<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email · {{ name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root {
  --dark:  #1a1f2e;
  --teal:  #1abc9c;
  --teal2: #0d9488;
  --teal3: #09655a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #dce1f6;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
}

/* ── PBAR ── */
#pbar {
  position: sticky; top: 0; z-index: 9999;
  background: #111; color: #fff;
  display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
  padding: .55rem 1.5rem; font-size: .78rem;
  box-shadow: 0 2px 12px rgba(0,0,0,.5);
}
#pbar .badge { background: var(--teal); color: #000; font-weight: 800; padding: .2em .65em; border-radius: 999px; font-size: .68rem; letter-spacing: .06em; }
#pbar .acts { margin-left: auto; display: flex; gap: .5rem; align-items: center; }
.pb { border: 1px solid rgba(255,255,255,.2); background: transparent; color: #fff; border-radius: 6px; padding: .28rem .7rem; font-size: .72rem; cursor: pointer; transition: background .15s; white-space: nowrap; }
.pb:hover { background: rgba(255,255,255,.1); }
.pb.prim { background: var(--teal); color: #000; border-color: var(--teal); font-weight: 700; }
.pb.dl { background: #1d4ed8; border-color: #1d4ed8; }
.pb.dl:hover { background: #1e40af; }

.tpl-nav  { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
.tpl-btn  { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: rgba(255,255,255,.65); border-radius: 5px; padding: .2rem .6rem; font-size: .69rem; cursor: pointer; transition: all .14s; white-space: nowrap; }
.tpl-btn:hover  { background: rgba(255,255,255,.16); color: #fff; }
.tpl-btn.active { background: var(--teal); color: #000; border-color: var(--teal); font-weight: 700; }

.lang-btn  { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: rgba(255,255,255,.65); border-radius: 5px; padding: .2rem .5rem; font-size: .68rem; font-weight: 700; letter-spacing: .03em; cursor: pointer; transition: all .14s; white-space: nowrap; }
.lang-btn:hover  { background: rgba(255,255,255,.16); color: #fff; }
.lang-btn.active { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }

/* ── OUTER CARD ── */
#email-card {
  max-width: 760px; margin: 2rem auto 5rem;
  box-shadow: 0 32px 100px rgba(0,0,0,.6), 0 0 0 1px rgba(26,188,156,.12);
  background: #fff;
  border-radius: 4px;
  overflow: hidden;
}

/* ════════════════════════════════════════
   HEADER
   ════════════════════════════════════════ */
.em-header {
  background: var(--dark);
  display: grid; grid-template-columns: 190px 1fr auto; align-items: center;
  position: relative; overflow: hidden;
  min-height: 140px; padding: 1.5rem 2.25rem 1.5rem 2rem;
}

.geo-left {
  position: absolute; left: 0; top: 0; height: 100%; width: 200px; pointer-events: none;
}
.geo-right {
  position: absolute; right: 0; top: 0; height: 100%; width: 200px; pointer-events: none;
  transform: scaleX(-1);
}

.em-logo-wrap {
  display: flex; justify-content: center; align-items: center;
  z-index: 2; padding: 0 1rem;
}
.em-logo-wrap img { max-width: 240px; max-height: 110px; object-fit: contain; }

.em-contacts { z-index: 2; display: flex; flex-direction: column; gap: .45rem; min-width: 190px; }
.em-contact-row { display: flex; align-items: center; gap: .55rem; color: rgba(255,255,255,.88); font-size: .8rem; white-space: nowrap; }
.em-contact-row i { color: var(--teal); font-size: .95rem; width: 16px; text-align: center; }

.em-left-pad { min-width: 190px; z-index: 2; }

/* ════════════════════════════════════════
   BODY
   ════════════════════════════════════════ */
.em-body { padding: 3rem 3.5rem 2.5rem; background: #fff; }

.em-subject-line {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.25rem; font-weight: 800;
  color: #111; line-height: 1.35;
  margin-bottom: 1.75rem;
  border-bottom: 2px solid #f0f0f0;
  padding-bottom: 1rem;
}

.em-salute { font-size: .95rem; color: #2d2d2d; margin-bottom: 1.5rem; font-weight: 500; }

.em-p  { font-size: .93rem; color: #2d2d2d; line-height: 1.9; margin-bottom: 1.15rem; text-align: justify; }
.em-ul { font-size: .93rem; color: #2d2d2d; line-height: 1.9; margin-bottom: 1.15rem; padding-left: 1.6rem; }
.em-ul li { margin-bottom: .35rem; }

.em-highlight {
  border-left: 3px solid var(--teal);
  background: #f0fdf9; padding: .9rem 1.25rem;
  border-radius: 0 6px 6px 0; margin: 1.5rem 0;
  font-size: .91rem; color: #1a5c52; line-height: 1.75;
}

.em-cta-wrap { margin: 2rem 0 .5rem; }
.em-btn {
  display: inline-block;
  background: var(--teal); color: #fff;
  border: none; border-radius: 6px;
  padding: .85rem 2.4rem; font-weight: 700; font-size: .9rem;
  font-family: 'Inter', sans-serif; cursor: pointer;
  text-decoration: none; letter-spacing: .01em;
}

.em-closing { margin-top: 2.5rem; font-size: .93rem; color: #2d2d2d; line-height: 1.85; }
.em-sign     { margin-top: 2.25rem; display: flex; justify-content: space-between; align-items: flex-end; }
.em-sign-left { font-size: .93rem; color: #555; }
.em-sign-right { text-align: right; }
.em-sign-name  { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.05rem; color: #111; }
.em-sign-role  { font-size: .78rem; color: var(--teal); font-weight: 600; margin-top: .15rem; letter-spacing: .02em; }

/* ════════════════════════════════════════
   FOOTER
   ════════════════════════════════════════ */
.em-footer {
  background: var(--dark);
  display: flex; align-items: center; justify-content: space-between;
  position: relative; overflow: hidden;
  min-height: 72px; padding: 1.25rem 2.25rem;
}
.em-footer-left  { color: rgba(255,255,255,.7); font-weight: 600; font-size: .9rem; z-index: 2; }
.em-footer-right { color: #fff; font-weight: 700; font-size: .95rem; z-index: 2; font-family: 'Montserrat', sans-serif; }

/* ── WATERMARK ── */
.wm { position: fixed; bottom: .75rem; right: .75rem; z-index: 8888; background: rgba(255,255,255,.06); color: rgba(255,255,255,.35); font-size: .63rem; padding: .3rem .65rem; border-radius: 8px; font-weight: 600; opacity: 1; pointer-events: none; border: 1px solid rgba(255,255,255,.08); }
.wm em { color: var(--teal); font-style: normal; }

@media (max-width: 600px) {
  #email-card { margin: .5rem .5rem 3rem; }

  .em-header {
    flex-direction: column; align-items: center;
    padding: 1.1rem 1rem; min-height: auto; gap: .7rem;
  }
  .em-left-pad { display: none; }
  .geo-left, .geo-right { width: 70px; }
  .em-logo-wrap { padding: 0; }
  .em-logo-wrap img { max-width: 72px; max-height: 72px; }
  .em-contacts { align-items: center; min-width: unset; }
  .em-contact-row { font-size: .72rem; }

  .em-body { padding: 1.6rem 1.1rem 1.25rem; }
  .em-subject-line { font-size: 1rem; }
  .em-p { text-align: left; }
  .em-btn { display: block; text-align: center; }

  .em-sign { flex-direction: column; align-items: flex-start; gap: .6rem; }
  .em-sign-right { text-align: left; }

  .em-footer {
    flex-direction: column; align-items: center;
    gap: .4rem; padding: .9rem 1rem; min-height: auto; text-align: center;
  }
}

@media print {
  #pbar { display: none !important; }
  .wm   { display: none; }
  body  { background: #fff; }
  #email-card { box-shadow: none; margin: 0; max-width: 100%; }
}
</style>
</head>
<body>

<!-- ── PBAR ── -->
<div id="pbar">
  <span class="badge">EMAIL</span>

  <span style="opacity:.25">|</span>
  {% if email %}
  <div style="display:flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:.22rem .55rem;font-size:.72rem;max-width:260px">
    <i class="bi bi-at" style="color:var(--teal);flex-shrink:0;font-size:.8rem"></i>

</div>

<!-- ── EMAIL CARD ── -->
<div id="email-card">

  <!-- ═══ HEADER ═══ -->
  <div class="em-header">

    <div class="em-contacts">
      <div class="em-contact-row"><i class="bi bi-telephone-fill"></i> <a href="tel:+393406228311" style="color:rgba(255,255,255,.88);text-decoration:none">+39 340 6228311</a></div>
      <div class="em-contact-row"><i class="bi bi-envelope-fill"></i> <a href="mailto:info@morgantidesign.it" style="color:rgba(255,255,255,.88);text-decoration:none">info@morgantidesign.it</a></div>
      <div class="em-contact-row"><i class="bi bi-globe2"></i> <a href="https://www.morgantidesign.it" target="_blank" style="color:rgba(255,255,255,.88);text-decoration:none">www.morgantidesign.it</a></div>
    </div>

  <!-- ═══ BODY ═══ -->
  <div class="em-body" id="em-body"></div>

  <!-- ═══ FOOTER ═══ -->
  <div class="em-footer">
    <div class="em-footer-left" id="em-footer-left">
      <a href="tel:+393406228311" style="color:rgba(255,255,255,.7);text-decoration:none">+39 340 6228311</a>
      &nbsp;·&nbsp;

<script>
const NAME          = {{ name|tojson }};
const BTYPE         = {{ btype|tojson }};
const ADDRESS       = {{ address|tojson }};
const CITY_PARAM    = {{ city|tojson }};
const RATING        = {{ rating|tojson }};
const REVIEW_COUNT  = {{ review_count|tojson }};
const TA_RATING     = {{ ta_rating|tojson }};
const TA_REVIEW_COUNT = {{ ta_review_count|tojson }};
const SITE_PLATFORM = {{ site_platform|tojson }};
const WEBSITE       = {{ website|tojson }};
const WEBSITE_STATUS = {{ website_status|tojson }};
const LOGO_B64      = {{ logo_b64|tojson }};

const city = (ADDRESS ? ADDRESS.split(',').pop().trim() : '') || CITY_PARAM;

const JS_TYPE_THEME = {
  restaurant:'food', fast_food:'food', ice_cream:'food', pizza:'food', bakery:'food', pastry:'food',
  bar:'cafe', cafe:'cafe', pub:'cafe', coffee:'cafe', biergarten:'cafe',
  hairdresser:'wellness', beauty:'wellness', spa:'wellness', nail_salon:'wellness',
  fitness_centre:'sport', gym:'sport', sports_centre:'sport', yoga:'sport',
  hotel:'hotel', guest_house:'hotel', hostel:'hotel', bed_and_breakfast:'hotel', motel:'hotel',
  pharmacy:'health', doctors:'health', dentist:'health', physiotherapist:'health', clinic:'health',
  lawyer:'professional', notary:'professional', accountant:'professional', tax_advisor:'professional',
  estate_agent:'realestate', car_repair:'automotive', car_wash:'automotive',
  clothes:'retail', shoes:'retail', jewellery:'retail',
  electronics:'tech', mobile_phone:'tech', computer:'tech',
  carpenter:'craft', electrician:'craft', plumber:'craft', painter:'craft',
};
const THEME_LABEL = {
  food:'ristorante', cafe:'bar / caffe', wellness:'salone di bellezza',
  sport:'palestra', hotel:'struttura', health:'studio medico',
  professional:'studio professionale', realestate:'agenzia immobiliare',
  automotive:'officina', retail:'negozio', tech:'negozio di elettronica',
  craft:'artigiano', default:'attivita',
};
const themeKey = JS_TYPE_THEME[(BTYPE||'').toLowerCase()] || 'default';
const label    = THEME_LABEL[themeKey] || 'attivita';
const cityLine = city ? ` a ${city}` : '';

// Articolo (determinativo/indeterminativo) corretto per genere del nome categoria in ${label}
const LABEL_ART = {
  food:{def:'il',indef:'un'}, cafe:{def:'il',indef:'un'}, wellness:{def:'il',indef:'un'},
  sport:{def:'la',indef:'una'}, hotel:{def:'la',indef:'una'}, health:{def:'lo',indef:'uno'},
  professional:{def:'lo',indef:'uno'}, realestate:{def:"l'",indef:"un'"}, automotive:{def:"l'",indef:"un'"},
  retail:{def:'il',indef:'un'}, tech:{def:'il',indef:'un'}, craft:{def:"l'",indef:'un'},
  default:{def:"l'",indef:"un'"},
};
const labelArt = LABEL_ART[themeKey] || LABEL_ART.default;

// ── Articolo italiano per "Una piccola idea per..." ──────────────────
function getItalianArticle(name, type) {
  // Se il nome inizia già con un articolo, non aggiungiamo nulla
  if (/^(il|la|lo|l'|l\u2019|i|gli|le|un|una|uno)\s/i.test(name.trim())) return '';
  const TYPE_ART = {
    restaurant:'il', fast_food:'il', pizza:'la', ice_cream:'la',
    bakery:'la', pastry:'la', bar:'il', cafe:'il', pub:'il', coffee:'il',
    biergarten:'il', hotel:"l'", guest_house:'il', hostel:"l'", bed_and_breakfast:'il',
    motel:'il', chalet:'lo', hairdresser:'il', beauty:'il', pharmacy:'la',
    doctors:'lo', dentist:'il', fitness_centre:'la', estate_agent:"l'",
    lawyer:'lo', notary:'il', accountant:'il', tax_advisor:'il', car_repair:"l'",
    clothes:'il', shoes:'il', electronics:'il', mobile_phone:'il',
    furniture:'il', interior_decoration:"l'", supermarket:'il', convenience:"l'",
    carpenter:'il', electrician:"l'", plumber:'il', painter:'il',
  };
  let art = TYPE_ART[(type||'').toLowerCase()] || 'il';
  // Elisione davanti a vocale o h
  const first = (name.trim()[0] || '').toLowerCase();
  const isVowel = 'aeiouàèéìíîòóùú'.includes(first);
  if ((art === 'il' || art === 'lo' || art === 'la') && (isVowel || first === 'h')) art = "l'";
  return art;
}
function copySuggestedSubject() {
  const text = document.getElementById('suggestedSubject').dataset.value || document.getElementById('suggestedSubject').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btnCopySubj');
    const orig = btn.textContent;
    btn.textContent = '✓ Copiato!';
    setTimeout(() => { btn.textContent = orig; }, 2000);
  });
}
function copyTargetEmail() {
  const el = document.getElementById('targetEmail');
  if (!el) return;
  navigator.clipboard.writeText(el.textContent.trim()).then(() => {
    const btn = document.getElementById('btnCopyEmail');
    const orig = btn.textContent;
    btn.textContent = '✓ Copiato!';
    setTimeout(() => { btn.textContent = orig; }, 2000);
  });
}

const reviewNote   = '';
const platformNote = SITE_PLATFORM ? SITE_PLATFORM : '';

// Website link for templates (clickable)
const websiteLink = WEBSITE
  ? `<a href="${WEBSITE.startsWith('http') ? WEBSITE : 'https://'+WEBSITE}" target="_blank" style="color:#0d9488">${WEBSITE}</a>`
  : '';

const SALUTE_PREFIX = {
  food:         'Gentili proprietari del ristorante',
  cafe:         'Gentili proprietari del bar',
  wellness:     'Gentili proprietari del salone',
  sport:        'Gentili titolari della palestra',
  hotel:        'Gentili titolari della struttura',
  health:       'Gentili titolari dello studio medico',
  professional: 'Gentili titolari dello studio professionale',
  realestate:   "Gentili titolari dell\u2019agenzia immobiliare",
  automotive:   "Gentili titolari dell\u2019officina",
  retail:       'Gentili proprietari del negozio',
  tech:         'Gentili titolari del negozio',
  craft:        "Gentili titolari dell\u2019attivit\u00e0",
  default:      "Gentili proprietari",
};
const salutePrefix = SALUTE_PREFIX[themeKey] || "Gentili proprietari";
const SALUTE = `<p class="em-salute">${salutePrefix} <strong>${NAME}</strong>,</p>`;

const CTA = `<div class="em-cta-wrap"><a href="https://www.morgantidesign.it" target="_blank" class="em-btn">Richiedete un preventivo gratuito &rarr;</a></div>`;

const CLOSING = (extra = '') => `
  <div class="em-closing">${extra ? `<p>${extra}</p>` : ''}
    <p>Resto a completa disposizione per qualsiasi domanda e vi ringrazio per il tempo dedicato alla lettura di questa email.</p>
  </div>
  <div class="em-sign">
    <div class="em-sign-left">Cordiali Saluti</div>
    <div class="em-sign-right">
      <div class="em-sign-name">Andrea Morganti</div>
      <div class="em-sign-role">Web Designer &amp; Software Developer</div>
    </div>
  </div>`;

// ══════════════════════════════════════════════════════════
// PORTFOLIO
// ══════════════════════════════════════════════════════════
const PORTFOLIO_ITEMS = [
  {
    img:      'https://res.cloudinary.com/jvrsszrd/image/upload/v1784910117/net7-mockup-1-scaled_k15dwe.jpg',
    title:    'Net7 — Soluzioni digitali',
    desc:     'Societ&agrave; digitale con sede a Pisa che collabora con aziende, PA, universit&agrave; e istituzioni culturali, trasformando obiettivi complessi in esperienze digitali misurabili.',
    url:      'https://morgantidesign.it/portfolio/net-7-sito-web/',
    imgRight: false,
  },
  {
    img:      'https://res.cloudinary.com/jvrsszrd/image/upload/v1784910118/premiocambiamenti-2025-scaled_rel240.jpg',
    title:    'Premio Cambiamenti 2026',
    desc:     'Il concorso nazionale CNA dedicato alle imprese italiane che innovano prodotti, processi e territori. La nona edizione ha visto la partecipazione di startup e PMI da tutta Italia.',
    url:      'https://morgantidesign.it/portfolio/premio-cambiamenti-2026/',
    imgRight: true,
  },
  {
    img:      'https://res.cloudinary.com/jvrsszrd/image/upload/v1784910117/confindustria-modello_phxstr.jpg',
    title:    'Confindustria Nautica',
    desc:     'Fondata nel 1967, Confindustria Nautica rappresenta l\'eccellenza italiana nel settore marittimo, promuovendo la nautica da diporto in Italia e nel mondo attraverso una rete di imprenditori capaci di innovare.',
    url:      'https://morgantidesign.it/portfolio/confindustria-nautica-italiana/',
    imgRight: false,
  },
];

function buildPortfolioTable() {
  const rows = PORTFOLIO_ITEMS.map(p => {
    const imgCell = `
      <td class="em-port-row" width="240" style="vertical-align:middle;width:240px;padding:0;line-height:0">
        <a href="${p.url}" target="_blank" style="display:block;text-decoration:none;border:0;line-height:0">
          <img class="em-port-img" src="${p.img}" alt="${p.title}" width="240"
               style="display:block;width:240px;max-width:240px;height:auto;border-radius:8px;border:0;box-shadow:0 6px 20px rgba(0,0,0,.15)">
        </a>
      </td>`;
    const gutter = `<td class="em-port-gutter" width="32" style="width:32px;font-size:0">&nbsp;</td>`;
    const textCell = `
      <td class="em-port-row" style="vertical-align:middle;font-family:Arial,Helvetica,sans-serif;padding:0">
        <div style="font-size:15px;font-weight:700;color:#111111;margin-bottom:8px;line-height:1.3;font-family:Arial,Helvetica,sans-serif">${p.title}</div>
        <div style="font-size:13px;color:#555555;line-height:1.85;margin-bottom:16px;font-family:Arial,Helvetica,sans-serif">${p.desc}</div>
        <a href="${p.url}" target="_blank"
           style="display:inline-block;background:#1abc9c;color:#ffffff !important;border-radius:5px;padding:9px 22px;font-size:12px;font-weight:700;text-decoration:none;font-family:Arial,Helvetica,sans-serif;letter-spacing:.03em">Vedi progetto &rarr;</a>
      </td>`;
    const cols = p.imgRight
      ? `${textCell}${gutter}${imgCell}`
      : `${imgCell}${gutter}${textCell}`;
    return `<tr>${cols}</tr>`;
  }).join(`
    <tr><td colspan="3" height="22" style="font-size:0">&nbsp;</td></tr>
    <tr><td colspan="3" height="1" bgcolor="#e8e8e8" style="background:#e8e8e8;font-size:0;line-height:0">&nbsp;</td></tr>
    <tr><td colspan="3" height="22" style="font-size:0">&nbsp;</td></tr>
  `);
  return `<table width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:28px 0 20px">${rows}</table>`;
}

function foreignLabel(lang)     { return I18N[lang].themeLabel[themeKey] || I18N[lang].themeLabel.default; }
function foreignCityLine(lang)  { return city ? `${I18N[lang].cityPrep}${city}` : ''; }
function foreignReviewNote(lang){ return ''; }
function foreignSalute(lang) {
  const prefix = I18N[lang].salutePrefix[themeKey] || I18N[lang].salutePrefix.default;
  return `<p class="em-salute">${prefix} <strong>${NAME}</strong>,</p>`;
}
function foreignCTA(lang, text) {
  return `<div class="em-cta-wrap"><a href="https://www.morgantidesign.it" target="_blank" class="em-btn">${text} &rarr;</a></div>`;
}
function foreignClosing(lang, extra = '') {
  const i = I18N[lang];
  return `
  <div class="em-closing">${extra ? `<p>${extra}</p>` : ''}
    <p>${i.closingThanks}</p>
  </div>
  <div class="em-sign">
    <div class="em-sign-left">${i.signOff}</div>
    <div class="em-sign-right">
      <div class="em-sign-name">Andrea Morganti</div>
      <div class="em-sign-role">${i.roleTitle}</div>
    </div>
  </div>`;
}
function foreignPortfolioTable(lang) {
  const items    = I18N[lang].portfolioItems;
  const viewText = I18N[lang].portfolioView;
  const rows = items.map(p => {
    const imgCell = `
      <td class="em-port-row" width="240" style="vertical-align:middle;width:240px;padding:0;line-height:0">
        <a href="${p.url}" target="_blank" style="display:block;text-decoration:none;border:0;line-height:0">
          <img class="em-port-img" src="${p.img}" alt="${p.title}" width="240"
               style="display:block;width:240px;max-width:240px;height:auto;border-radius:8px;border:0;box-shadow:0 6px 20px rgba(0,0,0,.15)">
        </a>
      </td>`;
    const gutter = `<td class="em-port-gutter" width="32" style="width:32px;font-size:0">&nbsp;</td>`;
    const textCell = `
      <td class="em-port-row" style="vertical-align:middle;font-family:Arial,Helvetica,sans-serif;padding:0">
        <div style="font-size:15px;font-weight:700;color:#111111;margin-bottom:8px;line-height:1.3;font-family:Arial,Helvetica,sans-serif">${p.title}</div>
        <div style="font-size:13px;color:#555555;line-height:1.85;margin-bottom:16px;font-family:Arial,Helvetica,sans-serif">${p.desc}</div>
        <a href="${p.url}" target="_blank"
           style="display:inline-block;background:#1abc9c;color:#ffffff !important;border-radius:5px;padding:9px 22px;font-size:12px;font-weight:700;text-decoration:none;font-family:Arial,Helvetica,sans-serif;letter-spacing:.03em">${viewText} &rarr;</a>
      </td>`;
    const cols = p.imgRight
      ? `${textCell}${gutter}${imgCell}`
      : `${imgCell}${gutter}${textCell}`;
    return `<tr>${cols}</tr>`;
  }).join(`
    <tr><td colspan="3" height="22" style="font-size:0">&nbsp;</td></tr>
    <tr><td colspan="3" height="1" bgcolor="#e8e8e8" style="background:#e8e8e8;font-size:0;line-height:0">&nbsp;</td></tr>
    <tr><td colspan="3" height="22" style="font-size:0">&nbsp;</td></tr>
  `);
  return `<table width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:28px 0 20px">${rows}</table>`;
}

function getTemplatesForLang(lang) {
  return lang === 'it' ? TEMPLATES : buildForeignTemplates(lang);
}

function buildSuggestedSubject(lang) {
  const bodyEl = document.getElementById('em-body');
  const subjEl = bodyEl && bodyEl.querySelector('.em-subject-line');
  if (subjEl && subjEl.textContent.trim()) {
    return subjEl.textContent.trim();
  }
  if (lang === 'it') {
    const art = getItalianArticle(NAME, BTYPE);
    return `Una piccola idea per ${art ? art + ' ' : ''}${NAME}`;
  }
  return I18N[lang].subjectPrefix(NAME);
}

// ── Render ──
let current = 0;
let LANG = 'it';

function renderTemplate(idx) {
  current = idx;
  const templates = getTemplatesForLang(LANG);
  const t = templates[idx] || templates[0];
  const body = document.getElementById('em-body');
  body.innerHTML = t.body;
  body.setAttribute('dir', I18N[LANG]?.dir || 'ltr');
  document.querySelectorAll('.tpl-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  refreshSuggestedSubject();
}

function buildNav() {
  const templates = getTemplatesForLang(LANG);
  document.getElementById('tplNav').innerHTML = templates.map((t, i) =>
    `<button class="tpl-btn" onclick="renderTemplate(${i})">${t.label}</button>`
  ).join('');
}

function refreshSuggestedSubject() {
  const text = buildSuggestedSubject(LANG);
  document.getElementById('suggestedSubject').textContent = text;
  document.getElementById('suggestedSubject').dataset.value = text;
}

function switchLang(lang) {
  LANG = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  buildNav();
  renderTemplate(0);
  refreshSuggestedSubject();
}

function buildLangNav() {
  const langs = [{ code:'it', flag:'IT' }, ...Object.keys(I18N).map(code => ({ code, flag: I18N[code].flag }))];
  document.getElementById('langNav').innerHTML = langs.map(l =>
    `<button class="lang-btn${l.code === LANG ? ' active' : ''}" data-lang="${l.code}" onclick="switchLang('${l.code}')">${l.flag}</button>`
  ).join('');
}

function nameKey(name) {
  return (name || '').toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 60);
}

function logEmailSent() {
  const templates = getTemplatesForLang(LANG);
  const t = templates[current] || templates[0];
  const subject = document.getElementById('suggestedSubject').dataset.value || '';
  fetch('/api/email-log/' + encodeURIComponent(nameKey(NAME)), {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name: NAME, subject, template: t ? t.label : '', lang: LANG })
  }).catch(() => {});
}

function copyPlainText() {
  const bodyEl = document.getElementById('em-body');
  const text   = bodyEl.innerText.replace(/\n{3,}/g, '\n\n').trim();
  navigator.clipboard.writeText(text).then(() => {
    const btn  = document.querySelector('[onclick="copyPlainText()"]');
    const orig = btn.innerHTML;
    btn.innerHTML = '<i class="bi bi-check2 me-1"></i>Copiato!';
    setTimeout(() => { btn.innerHTML = orig; }, 2200);
    logEmailSent();
  });
}

// ── Testo preheader nascosto: usato dai client email (Gmail, Outlook, Apple Mail...)
// come anteprima nella inbox al posto del primo contenuto visibile (i contatti nell'header) ──
function getPreheaderText() {
  const bodyEl = document.getElementById('em-body');
  const firstP = bodyEl.querySelector('.em-p, .em-salute');
  let text = (firstP ? firstP.innerText : bodyEl.innerText) || '';
  text = text.replace(/\s+/g, ' ').trim();
  return text.length > 150 ? text.slice(0, 147).trim() + '…' : text;
}

function buildPreheaderHTML() {
  const preheaderText = getPreheaderText().replace(/</g, '&lt;');
  return `
    <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;color:transparent;">
      ${preheaderText}

      ${'&#8199;&zwnj;'.repeat(120)}
    </div>`;
}

// ── CSS class → inline style map per email client ──────────────────────
function inlineifyForEmail(html) {
  const map = [
    [/class="em-subject-line"/g,
      'style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;color:#111111;line-height:1.35;border-bottom:2px solid #eeeeee;padding-bottom:14px;margin:0 0 22px 0;display:block"'],
    [/class="em-salute"/g,
      'style="font-size:15px;color:#2d2d2d;margin:0 0 18px 0;font-weight:500"'],
    [/class="em-p"/g,
      'style="font-size:14px;color:#2d2d2d;line-height:1.85;margin:0 0 14px 0"'],
    [/class="em-ul"/g,
      'style="font-size:14px;color:#2d2d2d;line-height:1.85;margin:0 0 14px 0;padding-left:22px"'],
    [/class="em-highlight"/g,
      'style="border-left:4px solid #1abc9c;background:#f0fdf9;padding:12px 18px;margin:18px 0;font-size:13px;color:#1a5c52;line-height:1.75;display:block"'],
    [/class="em-cta-wrap"/g,
      'style="margin:26px 0 8px"'],
    [/class="em-btn"/g,
      'style="display:inline-block;background:#1abc9c;color:#ffffff;border-radius:6px;padding:13px 36px;font-weight:700;font-size:14px;text-decoration:none;font-family:Arial,Helvetica,sans-serif;letter-spacing:.01em"'],
    [/class="em-closing"/g,
      'style="margin-top:32px;font-size:14px;color:#2d2d2d;line-height:1.85"'],
    [/class="em-sign"/g,
      'style="margin-top:28px;border-top:1px solid #eeeeee;padding-top:16px"'],
    [/class="em-sign-left"/g,
      'style="font-size:14px;color:#777777;margin-bottom:8px"'],
    [/class="em-sign-right"/g,
      'style="text-align:right"'],
    [/class="em-sign-name"/g,
      'style="font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:16px;color:#111111"'],
    [/class="em-sign-role"/g,
      'style="font-size:12px;color:#1abc9c;font-weight:600;margin-top:3px"'],
  ];
  let out = html;
  for (const [rx, rep] of map) out = out.replace(rx, rep);
  return out;
}

// ── Copia negli appunti come HTML formattato → incolla direttamente in Gmail ──
async function copyAsRichEmail() {
  const btn  = document.getElementById('btnRich');
  const orig = btn.innerHTML;
  btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i>...';
  btn.disabled  = true;

  const html = buildRichEmailHTML();

  try {
    await navigator.clipboard.write([
      new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }) })
    ]);
    btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i>Copiato! Incolla in Gmail';
    btn.style.background = '#16a34a';
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.style.background = '';
      btn.disabled = false;
    }, 3500);
    logEmailSent();
  } catch(err) {
    // Fallback: apri finestra con HTML da copiare manualmente
    const w = window.open('', '_blank', 'width=700,height=500');
    w.document.write(`<pre style="font-size:12px;word-break:break-all;white-space:pre-wrap">${html.replace(/</g,'&lt;')}</pre>`);
    btn.innerHTML = orig;
    btn.disabled  = false;
    alert('Clipboard API non disponibile. Si apre una finestra con l\'HTML da copiare manualmente.');
  }
}
